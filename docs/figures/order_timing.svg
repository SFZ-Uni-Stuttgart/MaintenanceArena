  <title id="title">Timing of one order</title>
  <desc id="desc">Health of one component over its operating time. It falls to the failure threshold at the end of life. An order must come at least L + 1 steps before the end of life, L preparation steps and one exchange step: this is the last safe order. Later orders fail before the exchange; earlier orders give up useful life.</desc>
